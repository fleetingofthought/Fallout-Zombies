# A branch that adds a chain or makes one reach further raises these numbers and changes
# them here in the same branch; a drop fails the run (find what the branch lost before
# lowering anything). Two branches that both raised a number conflict here when merged:
# run the command again on the merge and write what it prints, never keep both lines.
# Each chain's own mq-* scenario checks its milestones; this file only counts.

